plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // FTB Chunks / FTB Library / FTB Teams
    maven { url = 'https://maven.ftb.dev/releases' }
    // architectury (FTB の推移依存の解決用)
    maven { url = 'https://maven.architectury.dev/' }
    // Modrinth maven (ExplorersCompass / Nature's Compass)
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // G1 / A8 検証用: 起動と同時に localhost の専用サーバーへ繋ぐクライアント
        clientMp {
            client()
            programArgument '--quickPlayMultiplayer'
            programArgument 'localhost'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            // G1 ゲート検証用のスパイクを有効にする（dev run 限定。出荷 jar では不活性）
            systemProperty 'compasstomapftb.g1spike', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// ─────────────────────────────────────────────────────────────
// Dependencies
// 公開 jar には compileOnly + localRuntime のいずれもバンドルされない
// ─────────────────────────────────────────────────────────────
dependencies {
    // ─── Production (本MODが連携する API) ──────────────────────────
    // FTB Chunks: 必須依存 (waypoint 登録先。client API のみ使う)
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"

    // ExplorersCompass: 任意依存 (構造物 DataComponent 監視のホスト)
    compileOnly "maven.modrinth:explorers-compass:${ec_version}"

    // Nature's Compass: 任意依存 (バイオーム DataComponent 監視のホスト)
    compileOnly "maven.modrinth:natures-compass:${nc_version}"

    // ─── Dev-only (runClient テスト用、公開 jar には含まれない) ─────
    localRuntime "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    localRuntime "maven.modrinth:explorers-compass:${ec_version}"
    localRuntime "maven.modrinth:natures-compass:${nc_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            ftb_chunks_version_range: ftb_chunks_version_range,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// LICENSE jar 同梱
def licenseFile = file('LICENSE')
def licenseRenamed = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    inputs.file(licenseFile)
    from(licenseFile) { rename { licenseRenamed } }
}

// dev 用のホスト MOD (JEI 等) の絶対パス。gitignore 対象。
if (file('runclient-hosts.gradle').exists()) {
    apply from: 'runclient-hosts.gradle'
}
